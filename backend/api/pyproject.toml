[tool.pytest.ini_options]
# ".." 使共享包 backend/shared 可导入（shared.models）
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = [
    "live: 需要真实 API 服务在线的在线探针场景（默认由 HARNESS_PROBE_BASE 环境变量控制）",
]
filterwarnings = [
    # 测试专用短 HMAC 密钥（20 字节）触发 RFC 7518 建议，非生产配置问题
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
    # langgraph 内部使用弃用的 asyncio.iscoroutinefunction（Python 3.16 才移除），等待上游修复
    "ignore:.*'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
