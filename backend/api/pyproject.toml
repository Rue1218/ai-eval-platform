[tool.pytest.ini_options]
# ".." 使共享包 backend/shared 可导入（shared.models）
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = [
    "live: 需要真实 API 服务在线的在线探针场景（默认由 HARNESS_PROBE_BASE 环境变量控制）",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
