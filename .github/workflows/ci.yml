name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install sandbox runtime (bubblewrap)
        # bwrap 沙箱集成测试依赖 bubblewrap；未安装/被 userns 限制时
        # probe_sandbox 探测失败 → 集成测试自动 skip，不会误红。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Lint (ruff)
        run: ruff check . ../shared

      - name: Test (pytest)
        run: pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Test (pytest)
        # ".." 使共享包 backend/shared 可导入（shared.models）
        run: PYTHONPATH=.:.. pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (vue-tsc)
        # npm run build 不含类型检查，必须独立跑 typecheck 门禁
        run: npm run typecheck

      - name: Build (vite)
        run: npm run build
