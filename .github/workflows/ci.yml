name: CI

on:
  # 额度治理：功能分支与 Pull Request 不运行 Actions，仅 main 推送后校验。
  push:
    branches: [main]
    # 纯说明文档不消耗 Runner；运行时 SKILL.md 等提示词仍需验证。
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/README.md'

jobs:
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment scripts and asset layers
        # 不接触服务器；验证 Shell 语法与 Dockerfile 静态资源分层的完整性。
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/auto-deploy-watch.sh
          python3 -m unittest discover -s deploy/tests -v

  backend:
    runs-on: ubuntu-latest
    # 隔离临时 PG 运行真实事实/WS/文件闭环测试，绝不借用生产库。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentloop_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agentloop_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Probe sandbox runtime (unshare)
        # 容器内直跑沙箱集成测试依赖 util-linux 的 unshare；Ubuntu runner 自带，
        # 探测失败时 probe_sandbox()=False → 集成测试自动 skip，不会误红。
        run: |
          unshare --net --pid --fork --mount-proc true \
            && echo "unshare available" \
            || echo "unshare unavailable (sandbox integration tests will skip)"

      - name: Lint (ruff)
        run: ruff check . ../shared

      - name: Migrate isolated AgentLoop test database
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agentloop_ci
          # Alembic 不经过 pytest conftest，显式加入 backend 以导入共享模型。
          PYTHONPATH: .:..
        run: alembic upgrade head

      - name: Test (pytest)
        env:
          # 三套 Loop PostgreSQL 夹具共用 CI 隔离库；各自仅创建随机 schema 或 UUID 数据，
          # 不会操作 public 或业务库。三个变量必须同时配置，避免恢复/工具测试被静默跳过。
          LOOP_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agentloop_ci
          LOOP_STORE_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agentloop_ci
          LOOP_TOOLS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agentloop_ci
        run: pytest

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        # runner 的 pyproject 将 . 与 .. 加入 pythonpath，以导入 backend/shared。
        working-directory: backend/runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Runner 与共享沙箱内核仅依赖标准库；pytest 用于 HTTP 契约和清理语义测试。
        run: pip install pytest

      - name: Probe Linux sandbox runtime (unshare)
        # 验证 Linux 运行环境具备 util-linux unshare。真实命名空间集成用例需
        # RUNNER_TEST_UNSHARE=1，未设置时按标记跳过。
        run: |
          unshare --net --pid --fork --mount-proc true \
            && echo "unshare available" \
            || echo "unshare unavailable (namespace integration tests will skip)"

      - name: Test Runner (pytest)
        # 覆盖 Runner HTTP 契约、执行幂等、取消与共享内核的确定性清理路径。
        run: pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Test (pytest)
        # ".." 使共享包 backend/shared 可导入（shared.models）
        run: PYTHONPATH=.:.. pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (vue-tsc)
        # npm run build 不含类型检查，必须独立跑 typecheck 门禁
        run: npm run typecheck

      - name: AgentLoop reducer and transport tests
        run: npm test

      - name: Install browser for AgentLoop tests
        run: npx playwright install --with-deps chromium

      - name: AgentLoop browser contract tests
        run: npm run test:e2e

      - name: Build (vite)
        run: npm run build
