name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'Web-Prototype/**'
  workflow_dispatch:

# 同一台生产服务器一次只执行一个部署；新提交应淘汰旧提交，避免它们在服务器上重复构建。
concurrency:
  group: ai-eval-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "部署所需的 Secrets（SSH_HOST / SSH_PRIVATE_KEY）未配置，跳过部署。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        if: steps.check.outputs.skip != 'true'
        # 将触发工作流的提交透传到远端，禁止旧工作流改为部署更新后的 main。
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'deploy' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_COMMIT
          command_timeout: 30m
          script: |
            set -e
            APP_DIR=/opt/ai-eval-platform
            # 先同步到本次触发的提交，再加载其中的部署脚本，确保代码与工作流一一对应。
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git cat-file -e "${DEPLOY_COMMIT}^{commit}"
              git reset --hard "$DEPLOY_COMMIT"
            fi
            exec env DEPLOY_COMMIT="$DEPLOY_COMMIT" bash "$APP_DIR/deploy/deploy.sh"
