name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'Web-Prototype/**'
  workflow_dispatch:

# 部署只需读取仓库与历史工作流；SSH 凭据仍由仓库 Secrets 注入。
permissions:
  contents: read
  actions: read
  packages: write

# 同一台生产服务器一次只执行一个部署；新提交应淘汰旧提交，避免它们在服务器上重复构建。
concurrency:
  group: ai-eval-production-deploy
  cancel-in-progress: true

jobs:
  plan:
    name: Plan changed services
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      matrix: ${{ steps.services.outputs.matrix }}
      has_services: ${{ steps.services.outputs.has_services }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last successful deploy
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              status: 'success',
              per_page: 1,
            })
            const sha = runs.data.workflow_runs[0]?.head_sha || ''
            core.info(sha ? `上次成功部署提交：${sha}` : '未找到成功部署记录，本次构建全部业务服务')
            core.setOutput('sha', sha)

      - name: Calculate build matrix
        id: services
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TARGET_SHA: ${{ github.sha }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          definitions = {
              "web": {"service": "web", "context": "frontend", "dockerfile": "frontend/Dockerfile"},
              "api": {"service": "api", "context": "backend/api", "dockerfile": "backend/api/Dockerfile"},
              "worker": {"service": "worker", "context": "backend/worker", "dockerfile": "backend/worker/Dockerfile"},
              "lightrag": {"service": "lightrag", "context": "backend/lightrag", "dockerfile": "backend/lightrag/Dockerfile"},
              "stress": {"service": "stress", "context": "backend/stress", "dockerfile": "backend/stress/Dockerfile"},
          }
          path_prefixes = {
              "web": "frontend/",
              "api": "backend/api/",
              "worker": "backend/worker/",
              "lightrag": "backend/lightrag/",
              "stress": "backend/stress/",
          }

          base = os.environ.get("BASE_SHA", "")
          target = os.environ["TARGET_SHA"]
          base_valid = bool(base) and subprocess.run(
              ["git", "cat-file", "-e", f"{base}^{{commit}}"],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          if not base_valid:
              selected = list(definitions)
          else:
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", base, target],
                  text=True,
              ).splitlines()
              selected = [
                  service
                  for service, prefix in path_prefixes.items()
                  if any(path.startswith(prefix) for path in changed)
              ]

          matrix = {"include": [definitions[service] for service in selected]}
          print(f"动态构建服务：{', '.join(selected) if selected else '无'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"has_services={'true' if selected else 'false'}\n")

  build:
    name: Build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  deploy:
    needs: [plan, build]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "部署所需的 Secrets（SSH_HOST / SSH_PRIVATE_KEY）未配置，跳过部署。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        if: steps.check.outputs.skip != 'true'
        # 将触发工作流的提交透传到远端，禁止旧工作流改为部署更新后的 main。
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_BASE_COMMIT: ${{ needs.plan.outputs.base_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'deploy' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_COMMIT,DEPLOY_BASE_COMMIT,GHCR_TOKEN,GHCR_ACTOR,IMAGE_PREFIX,IMAGE_TAG
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=/opt/ai-eval-platform
            # 只 fetch，不在锁外 reset 工作区；从目标提交提取脚本后由脚本持锁完成同步。
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git cat-file -e "${DEPLOY_COMMIT}^{commit}"
              DEPLOY_ENTRY=$(mktemp)
              git show "${DEPLOY_COMMIT}:deploy/deploy.sh" > "$DEPLOY_ENTRY"
              chmod +x "$DEPLOY_ENTRY"
              exec env DEPLOY_COMMIT="$DEPLOY_COMMIT" DEPLOY_BASE_COMMIT="$DEPLOY_BASE_COMMIT" \
                GHCR_TOKEN="$GHCR_TOKEN" GHCR_ACTOR="$GHCR_ACTOR" \
                IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
                bash "$DEPLOY_ENTRY"
            fi
            echo "错误：部署目录不存在或尚未初始化：$APP_DIR"
            exit 1
