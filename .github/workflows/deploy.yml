name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'Web-Prototype/**'
  workflow_dispatch:

# 部署只需读取仓库与历史工作流；SSH 凭据仍由仓库 Secrets 注入。
permissions:
  contents: read
  actions: read

# 同一台生产服务器一次只执行一个部署；新提交应淘汰旧提交，避免它们在服务器上重复构建。
concurrency:
  group: ai-eval-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve last successful deploy
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              status: 'success',
              per_page: 1,
            })
            const sha = runs.data.workflow_runs[0]?.head_sha || ''
            core.info(sha ? `上次成功部署提交：${sha}` : '未找到成功部署记录，本次执行全量构建')
            core.setOutput('sha', sha)

      - name: Check deploy secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "部署所需的 Secrets（SSH_HOST / SSH_PRIVATE_KEY）未配置，跳过部署。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        if: steps.check.outputs.skip != 'true'
        # 将触发工作流的提交透传到远端，禁止旧工作流改为部署更新后的 main。
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'deploy' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_COMMIT,DEPLOY_BASE_COMMIT
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=/opt/ai-eval-platform
            # 只 fetch，不在锁外 reset 工作区；从目标提交提取脚本后由脚本持锁完成同步。
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git cat-file -e "${DEPLOY_COMMIT}^{commit}"
              DEPLOY_ENTRY=$(mktemp)
              git show "${DEPLOY_COMMIT}:deploy/deploy.sh" > "$DEPLOY_ENTRY"
              chmod +x "$DEPLOY_ENTRY"
              exec env DEPLOY_COMMIT="$DEPLOY_COMMIT" DEPLOY_BASE_COMMIT="$DEPLOY_BASE_COMMIT" \
                bash "$DEPLOY_ENTRY"
            fi
            echo "错误：部署目录不存在或尚未初始化：$APP_DIR"
            exit 1
