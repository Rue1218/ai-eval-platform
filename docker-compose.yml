name: ai-eval-platform

services:
  postgres:
    # 使用带 pgvector 扩展的官方镜像（同一 PG 16 大版本，pgdata 卷兼容）；
    # 与 postgres:16.x-alpine 一样锁定具体版本，避免浮动标签在重建时静默漂移。
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.0-pg16}
    # 1.6G 内存低配机护栏：防止单容器吃满内存拖垮整机（上限为天花板非预留）。
    mem_limit: 640m
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aieval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aieval_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aieval}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化数据卷时自动启用 vector 扩展；已有数据卷需按 README 执行一次性命令。
      - ./deploy/initdb/001-pgvector.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aieval} -d ${POSTGRES_DB:-aieval}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Harness 记忆层短期回合状态 / 会话索引 / 幂等键；仅容器网络内访问，不暴露公网端口。
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    mem_limit: 256m
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ai-eval-platform-api}
    mem_limit: 512m
    # 上下文为 backend/，Dockerfile 内 COPY api/ 与 shared/（共享模型包）
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aieval}:${POSTGRES_PASSWORD:-aieval_pass}@postgres:5432/${POSTGRES_DB:-aieval}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      # 协议档 URL、模型 ID、API Key 的宿主机环境文件；API 加锁刷新，Worker 只读。
      PROFILE_ENV_FILE: ${PROFILE_ENV_FILE:-/run/config/.env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      WS_TICKET_EXPIRE_MINUTES: ${WS_TICKET_EXPIRE_MINUTES:-5}
      DATA_DIR: /data
      # 管理端可编辑的 Agent 技能文件；首次启动仅从镜像模板补齐缺失文件。
      AGENT_SKILLS_ROOT: ${AGENT_SKILLS_ROOT:-/data/skills}
      # 启动迁移的等待与超时保护，可在服务器 .env 按数据库负载调整。
      DATABASE_CHECK_RETRIES: ${DATABASE_CHECK_RETRIES:-12}
      DATABASE_CHECK_INTERVAL_SECONDS: ${DATABASE_CHECK_INTERVAL_SECONDS:-5}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      MIGRATION_TIMEOUT_SECONDS: ${MIGRATION_TIMEOUT_SECONDS:-180}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-15000}
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-120000}
      # 音色克隆（MIMO TTS）。API Key 只从宿主机 .env 注入，禁止写入镜像或仓库。
      MIMO_TTS_BASE_URL: ${MIMO_TTS_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      MIMO_TTS_API_KEY: ${MIMO_TTS_API_KEY:-}
      MIMO_TTS_MODEL: ${MIMO_TTS_MODEL:-mimo-v2.5-tts-voiceclone}
      # Qwen Image 图像生成。API Key 只从宿主机 .env 注入，禁止写入镜像或仓库。
      QWEN_IMAGE_API_URL: ${QWEN_IMAGE_API_URL:-}
      QWEN_IMAGE_API_KEY: ${QWEN_IMAGE_API_KEY:-}
      QWEN_IMAGE_MODEL: ${QWEN_IMAGE_MODEL:-}
      QWEN_IMAGE_TIMEOUT_SECONDS: ${QWEN_IMAGE_TIMEOUT_SECONDS:-120}
      # 原生 web_search/web_fetch 通过服务端 Firecrawl REST 调用；Key 只注入 API。
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev/v1}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # 混合引擎开启后，生产环境必须使用 PostgreSQL 检查点并启用启动门禁。
      AGENT_CHECKPOINTER: ${AGENT_CHECKPOINTER:-memory}
      AGENT_HITL_STRICT_PG: ${AGENT_HITL_STRICT_PG:-false}
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-}
      HYBRID_ENGINE_ENABLED: ${HYBRID_ENGINE_ENABLED:-false}
      # H5 收尾演练开关（默认 false fail-closed；仅演练环境临时置 true，结束置回）。
      AGENT_DRILL_SANDBOX_ENABLED: ${AGENT_DRILL_SANDBOX_ENABLED:-false}
      # native 首轮流式；默认开启。并行默认关，且必须填写协议档白名单或 *。
      AGENT_NATIVE_STREAM_ENABLED: ${AGENT_NATIVE_STREAM_ENABLED:-true}
      AGENT_NATIVE_STREAM_PROFILE_IDS: ${AGENT_NATIVE_STREAM_PROFILE_IDS:-}
      # P1 原生工具装配（方案 V0.2.1）：默认关 = 请求逐字节不带 tools（零变化）；
      # 冒烟/灰度开闸 = true + PROFILE_IDS 填测试档（空 = 不开任何档，* = 全部）。
      AGENT_NATIVE_TOOLS_ENABLED: ${AGENT_NATIVE_TOOLS_ENABLED:-false}
      AGENT_NATIVE_TOOLS_PROFILE_IDS: ${AGENT_NATIVE_TOOLS_PROFILE_IDS:-}
      AGENT_PARALLEL_TOOL_BATCH_ENABLED: ${AGENT_PARALLEL_TOOL_BATCH_ENABLED:-false}
      MAX_PARALLEL_TOOL_CALLS: ${MAX_PARALLEL_TOOL_CALLS:-3}
      AGENT_PARALLEL_TOOL_BATCH_PROFILE_IDS: ${AGENT_PARALLEL_TOOL_BATCH_PROFILE_IDS:-}
      # Harness 记忆层 Redis 连接（短期回合状态 / 幂等键）；接入前无消费者，仅预注入。
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # 检索 Playground / RAG 评测的 LightRAG 服务地址；stub 空返回时共享检索层自动回退本地关键词。
      LIGHTRAG_BASE_URL: ${LIGHTRAG_BASE_URL:-http://lightrag:9621}
      # 沙箱 runner（compose 内网，不发布主机端口；P4-3 起 bash 由 runner 执行）
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://runner:8001}
      RUNNER_INTERNAL_TOKEN: ${RUNNER_INTERNAL_TOKEN:-}
      AGENT_LOOP_MAX_STEPS: ${AGENT_LOOP_MAX_STEPS:-16}
      AGENT_LOOP_MAX_PARALLEL_TOOL_CALLS: ${AGENT_LOOP_MAX_PARALLEL_TOOL_CALLS:-4}
      AGENT_LOOP_RECONNECT_GRACE_SECONDS: ${AGENT_LOOP_RECONNECT_GRACE_SECONDS:-20}
      # 媒体 MCP 只走 Compose 内网；主闸门默认关闭，启用前需完成工具与任务联调。
      MEDIA_MCP_ENABLED: ${MEDIA_MCP_ENABLED:-false}
      MEDIA_MCP_URL: ${MEDIA_MCP_URL:-http://media-mcp:8002/mcp}
      MEDIA_MCP_REQUEST_TIMEOUT_S: ${MEDIA_MCP_REQUEST_TIMEOUT_S:-180}
    # Harness 沙箱（bash 工具）：bwrap 已迁至独立 runner 容器（P4-2），
    # api 不再需要 privileged/seccomp:unconfined/SYS_ADMIN/bubblewrap。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-mcp:
        # 媒体工具启用后，API 必须等待其 Streamable HTTP 端点就绪，避免启动后首轮调用直连失败。
        condition: service_healthy
      runner:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./.env:/run/config/.env
      # 外部白名单基目录（与 runner 同路径，供 read/write/edit 解析绝对路径）。
      - ${EXTERNAL_BASE_DIR:-/srv/agent-external}:${EXTERNAL_BASE_DIR:-/srv/agent-external}:rw
    # API 同时连接默认业务网与仅供沙箱调用的内网；runner 不暴露到业务网。
    networks:
      - default
      - sandbox_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  media-mcp:
    # 独立 Streamable HTTP MCP：只在 Compose 内网开放，由平台后端接入。
    image: ${MEDIA_MCP_IMAGE:-ai-eval-platform-media-mcp}
    mem_limit: 384m
    build:
      context: ./backend
      dockerfile: media_mcp/Dockerfile
    restart: unless-stopped
    environment:
      # 兼容模式基础 URL 用于 Qwen 生图；视频接口从同一业务空间域名派生。
      MEDIA_MCP_COMPATIBLE_BASE_URL: ${MEDIA_MCP_COMPATIBLE_BASE_URL:-}
      MEDIA_MCP_API_KEY: ${MEDIA_MCP_API_KEY:-}
      MEDIA_MCP_IMAGE_MODEL: ${MEDIA_MCP_IMAGE_MODEL:-qwen-image-3.0-pro}
      MEDIA_MCP_VIDEO_MODEL: ${MEDIA_MCP_VIDEO_MODEL:-happyhorse-1.1-i2v}
      MEDIA_MCP_REQUEST_TIMEOUT_SECONDS: ${MEDIA_MCP_REQUEST_TIMEOUT_SECONDS:-600}
      # 管理端原位更新该只读挂载；媒体服务按调用读取，密钥不进入 API 响应。
      MEDIA_MCP_CONFIG_FILE: /run/config/.env
    volumes:
      - ./.env:/run/config/.env:ro
    # 不发布主机端口；平台接入地址固定为 http://media-mcp:8002/mcp。
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  runner:
    # 独立沙箱 Runner：bash 在容器内直跑（容器即隔离边界，unshare 建 netns/pidns）。
    # 唯一持有 seccomp:unconfined + SYS_ADMIN（建命名空间）+ NET_ADMIN（档3 专用
    # netns/veth 出公网）的容器；read_only rootfs 使系统目录天然只读。
    #   - read_only rootfs + /tmp /run tmpfs + no-new-privileges（写落盘受限）；
    #   - 容器 root 运行：Docker --user 下 cap-add 不生效（CapEff=0）→ 非 root 否决。
    image: ${RUNNER_IMAGE:-ai-eval-platform-runner}
    mem_limit: 512m
    build:
      context: ./backend
      dockerfile: runner/Dockerfile
      # 服务器本地构建由 deploy.sh 注入 APT_MIRROR（USTC 镜像源）；
      # CI 不传时为空，Dockerfile 内保持 Debian 官方源。
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m
      - /run:rw,size=8m
    # 档3 网络启动器需在容器内转发（netns/veth 出公网）
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      # 工作区根（与 api 同挂 ./data/workspaces，路径两侧一致）
      SANDBOX_WORKSPACE_ROOT: /data/workspaces
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: "8001"
      RUNNER_INTERNAL_TOKEN: ${RUNNER_INTERNAL_TOKEN:-}
    volumes:
      # 仅挂工作区（不挂整盘 ./data，避免暴露备份/其他数据）；系统目录靠
      # read_only rootfs 兜底；外部白名单基目录按需 rw 挂入。
      - ./data/workspaces:/data/workspaces
      - ${EXTERNAL_BASE_DIR:-/srv/agent-external}:${EXTERNAL_BASE_DIR:-/srv/agent-external}:rw
    networks:
      - sandbox_net
      - runner_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; print(json.load(urllib.request.urlopen('http://localhost:8001/health')))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  worker:
    image: ${WORKER_IMAGE:-ai-eval-platform-worker}
    mem_limit: 384m
    # 上下文为 backend/，Dockerfile 内 COPY worker/ 与 shared/（共享模型包）
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aieval}:${POSTGRES_PASSWORD:-aieval_pass}@postgres:5432/${POSTGRES_DB:-aieval}
      DATA_DIR: /data
      # Worker 需解密协议档密文：加密密钥必须与 api 容器一致
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      PROFILE_ENV_FILE: ${PROFILE_ENV_FILE:-/run/config/.env}
      # 与 api 容器共享同一 Redis；Worker 后续按需消费任务事件。
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # RAG 评测检索的 LightRAG 服务地址；stub 空返回时共享检索层自动回退本地关键词。
      LIGHTRAG_BASE_URL: ${LIGHTRAG_BASE_URL:-http://lightrag:9621}
      # 压测引擎（容器内网）；Worker 只下发 / 轮询，不在本进程发压。
      STRESS_URL: ${STRESS_URL:-http://stress:19090}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      stress:
        condition: service_started
    volumes:
      - ./data:/data
      - ./.env:/run/config/.env:ro

  web:
    image: ${WEB_IMAGE:-ai-eval-platform-web}
    mem_limit: 64m
    build:
      context: ./frontend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
        # Vite 构建堆：CI 默认 4096；服务器本地构建由 deploy.sh 收紧为 768。
        NODE_BUILD_MEMORY: ${NODE_BUILD_MEMORY:-4096}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

  lightrag:
    image: ${LIGHTRAG_IMAGE:-ai-eval-platform-lightrag}
    mem_limit: 512m
    build: ./backend/lightrag
    restart: unless-stopped
    environment:
      LIGHTRAG_LLM_API_KEY: ${LIGHTRAG_LLM_API_KEY:-}
      LIGHTRAG_LLM_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-}
      LIGHTRAG_LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-gpt-4o-mini}
      LIGHTRAG_EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-BAAI/bge-m3}
    ports:
      - "${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - ./data/lightrag:/data/lightrag

  stress:
    image: ${STRESS_IMAGE:-ai-eval-platform-stress}
    mem_limit: 128m
    build: ./backend/stress
    restart: unless-stopped
    ports:
      - "${STRESS_PORT:-19090}:19090"

volumes:
  pgdata:
  redisdata:

networks:
  # 控制面内网：仅 api↔runner（postgres/redis 不在其上，runner 结构性不可达）。
  sandbox_net:
    internal: true
  # 出网网络：仅 runner，提供公网（档3 专用 netns/veth 只经此出网，隔离内网）。
  runner_egress: {}
