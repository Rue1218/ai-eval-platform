server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 附件上传上限（对齐后端 files.py MAX_FILE_BYTES=20MB）；nginx 默认 1m 会拦掉
    # 真实附件（413），必须显式放开，否则前端"≤20MB"的上限名存实亡。
    client_max_body_size 20m;

    # Vite 产物携带内容哈希，可长期缓存；缺失文件必须返回 404，不能误回退为 HTML。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # HTML 是发布清单，始终让浏览器重新校验，避免旧入口引用已替换的动态分包。
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 上游 api 主机名用变量 + Docker 内嵌 DNS 动态解析：nginx 仅启动时解析并缓存
    # 主机名的旧 IP，api 容器重建（docker compose up -d --build api / auto-sync 热更）换新
    # IP 后旧缓存失效会 502（实测 2026-08-25，upstream 连 172.19.0.6 被拒）。
    # resolver 127.0.0.11 是 Docker 内嵌 DNS；valid 周期重解析，ipv6=off 只走 IPv4。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
