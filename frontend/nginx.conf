map $arg_session_id $session_route_key {
    # 尚未携带 session_id 的握手使用客户端地址兜底，正式 Agent 会话始终按会话 ID 路由。
    ""      $remote_addr;
    default $arg_session_id;
}

# Docker 内嵌 DNS 返回 api 服务的全部副本地址；resolve 让副本重建后自动刷新。
# hash 保证同一 session_id 的 WS 重连落到同一 API 副本，保留进程内 abort/turn 状态。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_http {
    zone api_http 64k;
    server api:8000 resolve;
}

upstream api_ws {
    zone api_ws 64k;
    hash $session_route_key consistent;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 附件上传上限（对齐后端 files.py MAX_FILE_BYTES=20MB）；nginx 默认 1m 会拦掉
    # 真实附件（413），必须显式放开，否则前端"≤20MB"的上限名存实亡。
    client_max_body_size 20m;

    # Vite 产物携带内容哈希，可长期缓存；缺失文件必须返回 404，不能误回退为 HTML。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # HTML 是发布清单，始终让浏览器重新校验，避免旧入口引用已替换的动态分包。
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # REST 请求使用动态 upstream，允许 api 扩容并在副本重建后刷新地址。
    location /api/ {
        proxy_pass http://api_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WS 使用 session_id 一致性哈希，支撑多 API 副本下的进程内会话状态与中断控制。
    location /ws/ {
        proxy_pass http://api_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
