<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>调度大盘联调夹具</title></head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp, h } from 'vue'
    import { createRouter, createMemoryHistory, RouterView } from 'vue-router'
    import naive, { NMessageProvider } from 'naive-ui'
    import Dispatch from '../src/views/Dispatch.vue'
    import '../src/styles/tokens.css'
    import '../src/styles/base.css'
    // 挂载真实调度页，HTTP 响应由 Playwright 拦截提供。
    const router = createRouter({ history: createMemoryHistory(), routes: [
      { path: '/dispatch', component: Dispatch },
      { path: '/tasks', component: { render: () => h('div') } },
    ] })
    const app = createApp({ render: () => h(NMessageProvider, {}, { default: () => h(RouterView) }) })
    router.push('/dispatch').then(() => app.use(router).use(naive).mount('#app'))
  </script>
</body>
</html>
