<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="750" viewBox="0 0 1060 750" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">AgentLoop 工具线性图标方案</title>
  <desc id="sheet-desc">16 个本地 SVG symbol；前十个对应当前工具选择，其余为源历史、MCP 与未知工具展示。图标不代表工具已注册。</desc>
  <defs>
    <symbol id="file-read" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 12h6M9 16h6"/>
    </symbol>
    <symbol id="file-write" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 14h6M12 11v6"/>
    </symbol>
    <symbol id="file-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 3H5v18h9M13 3v5h5V8l-5-5M11 19l1-4 7-7 3 3-7 7zM17 10l3 3"/>
    </symbol>
    <symbol id="terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>
    </symbol>
    <symbol id="search-web" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c-4 4-4 10 0 14M10 3c4 4 4 10 0 14m5-2 6 6"/>
    </symbol>
    <symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>
    </symbol>
    <symbol id="message-question" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 3V6a2 2 0 0 1 2-2M10 9a2 2 0 1 1 3 1.7c-1 .6-1 1-1 1.3M12 15h.01"/>
    </symbol>
    <symbol id="task-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 5H5v16h10M16 5h3v6M9 10h4M9 14h2M18 14v7M14.5 17.5h7"/><rect x="8" y="3" width="8" height="4" rx="1"/>
    </symbol>
    <symbol id="list-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 6 2 2 3-4M11 6h10m-18 7 2 2 3-4M11 13h10M4 20h3M11 20h10"/>
    </symbol>
    <symbol id="circle-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/>
    </symbol>
    <symbol id="folder-tree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4h6l2 3h10v7H3zM6 14v6h5M6 17h5M15 18h6v4h-6z"/>
    </symbol>
    <symbol id="files-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3h10v6M5 6H3v15h10M6 6h9v4"/><circle cx="15" cy="15" r="4"/><path d="m18 18 3 3"/>
    </symbol>
    <symbol id="text-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 5h18M3 10h7M3 15h4M3 20h5"/><circle cx="15" cy="15" r="4"/><path d="m18 18 3 3"/>
